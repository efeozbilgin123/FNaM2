<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>B · Otopsi masası</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Reenie+Beanie&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{--table:#3d4447;--paper:#ece6d6;--ballpoint:#1f3a8a;--redpen:#b01822;--lamp:#fff6dd}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;overflow:hidden;background:#070a0b;font-family:'Courier Prime',monospace;color:#1c1c1c}
.table{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px),linear-gradient(#3d4447,#2a3033)}
.drain{position:absolute;right:120px;top:300px;width:60px;height:60px;border-radius:50%;background:radial-gradient(#0c0f10 40%,#59625f 42%,#2a3033 60%)}
.lamp{position:absolute;inset:0;background:radial-gradient(ellipse 480px 400px at 520px 360px,rgba(255,246,221,.35),rgba(255,246,221,.08) 55%,rgba(0,0,0,.85) 100%);mix-blend-mode:screen}
.dark{position:absolute;inset:0;background:radial-gradient(ellipse 560px 460px at 520px 360px,transparent 40%,rgba(0,0,0,.75) 85%)}
.board{position:absolute;left:260px;top:56px;width:520px;height:630px;background:#6b4a2b;border-radius:12px;transform:rotate(-2.5deg);box-shadow:0 30px 50px rgba(0,0,0,.7)}
.clip{position:absolute;left:50%;top:-16px;width:150px;height:44px;margin-left:-75px;background:linear-gradient(#c9ced0,#7a8285);border-radius:6px;box-shadow:0 4px 6px rgba(0,0,0,.5);z-index:3}
.form{position:absolute;left:22px;right:22px;top:26px;bottom:22px;background:var(--paper);padding:40px 34px 20px;box-shadow:inset 0 0 40px rgba(120,100,60,.25)}
.form h1{font:400 64px 'Saira Stencil One';color:#1c1c1c;letter-spacing:10px;line-height:1}
.form .t{font-size:14px;letter-spacing:1px;margin:6px 0 18px;border-bottom:2px solid #1c1c1c;padding-bottom:8px}
.row{display:flex;align-items:baseline;gap:12px;padding:9px 4px;border-bottom:1px dotted #8a8578;font-size:22px;cursor:pointer;position:relative;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit;color:inherit}
.row .box{width:22px;height:22px;border:2px solid #1c1c1c;flex:none;position:relative;top:3px}
.row .hand{margin-left:auto;font:400 30px 'Reenie Beanie';color:var(--ballpoint)}
.row:hover .box::after,.row:focus-visible .box::after{content:'✗';position:absolute;left:-1px;top:-14px;font:400 40px 'Reenie Beanie';color:var(--redpen)}
.row:hover,.row:focus-visible{outline:none}
.row:hover .lbl,.row:focus-visible .lbl{text-decoration:underline wavy var(--redpen) 2px;text-underline-offset:6px}
.note{position:absolute;left:34px;right:34px;bottom:26px;font:400 30px 'Reenie Beanie';color:var(--redpen);transform:rotate(-1.5deg)}
.polaroid{position:absolute;right:-60px;top:70px;width:170px;padding:10px 10px 34px;background:#f4f1ea;transform:rotate(7deg);box-shadow:0 10px 20px rgba(0,0,0,.5);z-index:2}
.polaroid img{width:150px;height:180px;object-fit:cover;display:block;filter:grayscale(1) contrast(1.1)}
.polaroid span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:400 24px 'Reenie Beanie';color:var(--ballpoint)}
.staple{position:absolute;right:30px;top:-2px;width:34px;height:6px;background:#a4abae;transform:rotate(-8deg);z-index:3}
.tools{position:absolute;right:150px;top:470px;width:250px;height:14px;background:linear-gradient(#d9dee0,#878f93);border-radius:7px;transform:rotate(18deg);box-shadow:0 8px 12px rgba(0,0,0,.6)}
.tools::after{content:'';position:absolute;right:-60px;top:-5px;width:70px;height:22px;background:linear-gradient(#eef1f2,#9aa2a6);clip-path:polygon(0 30%,100% 50%,0 70%)}
.vol{position:absolute;right:60px;top:40px;display:flex;align-items:center;gap:10px;font:400 30px 'Reenie Beanie';color:#d8d2c0}
.vol i{display:block;width:110px;height:3px;background:linear-gradient(90deg,#d8d2c0 80%,#5b615f 80%)}
</style></head><body>
<div class="table"></div><div class="drain"></div><div class="tools"></div>
<div class="lamp"></div><div class="dark"></div>
<div class="board"><div class="clip"></div>
  <div class="form">
    <h1>MORG</h1>
    <div class="t">OTOPSİ / NÖBET FORMU · Kayıt 98/0456 · Mırık'la 5 Gece</div>
    <button class="row"><span class="box"></span><span class="lbl">Yeni oyun</span></button>
    <button class="row"><span class="box"></span><span class="lbl">Devam et</span><span class="hand">3. gece</span></button>
    <button class="row"><span class="box"></span><span class="lbl">6. gece</span></button>
    <button class="row"><span class="box"></span><span class="lbl">Custom Night</span></button>
    <button class="row"><span class="box"></span><span class="lbl">Arşiv</span><span class="hand">4 belge</span></button>
    <div class="note">Nöbetçi: ________ &nbsp;(5 numarayı soğuk tut)</div>
    <div class="polaroid"><div class="staple"></div><img src="../img/menu_face.png" alt=""><span>H.E.M. 1998</span></div>
  </div>
</div>
<div class="vol">ses <i></i></div>
</body></html>
